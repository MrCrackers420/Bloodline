<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="only dark"> <!-- the game is drawn dark by itself: browsers must not darken, lighten or invert it on their own -->
<title>Bloodline: The Wilds</title>
<style>
  :root{
    color-scheme: only dark;
    --bg:#15100f; --bg2:#1d1613; --field:#241a17;
    --crimson:#9c2a44; --crimson-lt:#c73a5c;
    --teal:#2e5e5b; --teal-lt:#3f8580;
    --bone:#d9c9a3; --bone-dim:#8f8470;
    --line:#3a2c27; --ok:#7fae6b;
  }
  *{box-sizing:border-box;}
  *{touch-action:pan-x pan-y;}
  html,body{overflow:hidden; overscroll-behavior:none;}
  body{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;}
  input,textarea{-webkit-user-select:text; user-select:text;}
  html,body{height:100%;}
  @supports (height:100dvh){
    body{height:100dvh;}
  }
  body{
    margin:0; background:var(--bg); color:var(--bone);
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  #wdOverlay{ z-index:62; background:#0a0706; padding:0 !important; gap:0; justify-content:flex-start; align-items:stretch; overflow:hidden; touch-action:none; }
  .uf-stage{ position:absolute; inset:0; }
  .uf-hud{ position:absolute; left:0; right:0; top:0; pointer-events:none; z-index:2; display:flex; justify-content:space-between; align-items:flex-start;
    padding:max(3vmin, env(safe-area-inset-top,0px)) max(4vmin, env(safe-area-inset-right,0px)) 0 max(4vmin, env(safe-area-inset-left,0px)); font-size:clamp(14px, 2.6vmin, 30px); color:var(--bone); }
  .uf-stats{ display:flex; flex-direction:column; gap:.25em; text-shadow:0 0 6px #000, 0 0 3px #000; background:rgba(10,7,6,.62); padding:.35em .6em .5em; border-radius:6px; }
  .uf-stats span{ font-size:.7em; letter-spacing:.12em; color:var(--bone-dim); }
  .uf-hp b{ color:#ee5a75; font-size:1.6em; }
  .wd-belly b{ color:#e0b54a; font-size:1.25em; }
  .wd-belly.low b{ color:#ff7a3c; animation:wd-blink 1s steps(2) infinite; }
  @keyframes wd-blink{ 50%{ opacity:.45; } }
  .wd-clock{ display:flex; flex-direction:column; align-items:center; gap:.25em; }
  #wdDial{ width:3.6em; height:3.6em; }
  .uf-roomlab{ font-size:.8em; text-shadow:0 0 6px #000; background:rgba(10,7,6,.62); padding:.1em .45em; border-radius:4px; }
  .uf-roomlab b{ color:#e0b54a; }
  #wdHotbar{position:absolute;left:50%;transform:translateX(-50%);bottom:max(2.5vmin, env(safe-area-inset-bottom,0px));z-index:2;display:flex;flex-direction:column;align-items:center;gap:.35em;font-size:clamp(12px,2.2vmin,24px);max-width:96vw;}
  #wdHotbar .wd-bar{position:static;transform:none;font-size:inherit;}
  #wdHotbarActions{display:flex;gap:.35em;justify-content:center;flex-wrap:wrap;}
  #wdHotbarActions button{font-size:.65em;padding:.35em .65em;}
  #wdHotbarActions button:disabled{opacity:.4;cursor:default;}
  #wdHotbarItem{font-size:.65em;color:#e0b54a;text-align:center;}
  .wd-slot .wd-key{position:absolute;left:.2em;top:0;font-size:.5em;color:var(--bone-dim);pointer-events:none;}
  .wd-bar{ position:absolute; left:50%; transform:translateX(-50%); bottom:max(2.5vmin, env(safe-area-inset-bottom,0px)); z-index:2; display:flex; gap:.25em; font-size:clamp(12px, 2.2vmin, 24px); }
  .wd-slot{ position:relative; width:min(2.6em, 8.4vw); height:min(2.6em, 8.4vw); border:2px solid #3a2c27; border-radius:5px; background:rgba(16,11,10,.85); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .wd-slot img{ width:80%; height:80%; image-rendering:auto; pointer-events:none; }
  .wd-slot i{ position:absolute; right:.15em; bottom:0; font-style:normal; font-size:.62em; color:var(--bone); text-shadow:0 0 3px #000, 0 0 2px #000; }
  .wd-slot.sel{ border-color:#e0b54a; box-shadow:0 0 6px rgba(224,181,74,.55); }
  .wd-hint button{pointer-events:auto;background:#241a14;color:#eadcc4;border:1px solid #896744;border-radius:4px;padding:.35em;cursor:pointer;}
  .wd-hint{ position:absolute; left:50%; transform:translateX(-50%); bottom:calc(max(2.5vmin, env(safe-area-inset-bottom,0px)) + min(3.4em, 11vw) + 4em); z-index:2; pointer-events:none; font-size:clamp(12px, 2.1vmin, 22px); color:var(--bone); text-shadow:0 0 6px #000, 0 0 3px #000; background:rgba(10,7,6,.55); padding:.15em .6em; border-radius:4px; white-space:normal; max-width:94vw; width:max-content; }
  .wd-hint:empty{ display:none; }
  .wd-hint b{ color:#e0b54a; }
  .overlay button.uf-pause{ position:absolute; right:max(4vmin, env(safe-area-inset-right,0px)); bottom:max(3vmin, env(safe-area-inset-bottom,0px)); z-index:2; font-size:clamp(12px, 2vmin, 20px); opacity:.7; }
  @media (max-aspect-ratio:1/1){ .overlay button.uf-pause{ bottom:calc(max(2.5vmin, env(safe-area-inset-bottom,0px)) + min(3.4em, 11vw) + 2.4em); } } /* tall screens: above the slot bar */
  #wdCanvas{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  .uf-panel{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:.6em; background:rgba(10,7,6,.9); z-index:3; text-align:center; padding:5vmin; font-size:clamp(14px, 2.3vmin, 26px); line-height:1.45; }
  .overlay .uf-panel button{ font-size:1em; padding:.45em 1.4em; min-width:8em; }
  .overlay .uf-panel button small{ display:block; font-size:.7em; color:var(--bone-dim); }
  .overlay .uf-panel button:disabled{ opacity:.4; }
  #wdOverlay .pad-focus{ outline-width:3px !important; outline-offset:3px; }
  .uf-panel.on{ display:flex; }
  #wdBag{ background:rgba(10,7,6,.92); overflow-y:auto; justify-content:safe center; gap:.35em; padding:2vmin; }
  #wdInventoryLayout{display:flex;align-items:flex-start;gap:1em;width:min(58em,96vw);}
  #wdInventoryMain{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:.35em;}
  #wdAccessoryPage{flex:0 0 17em;display:flex;flex-direction:column;gap:.55em;text-align:left;padding:.8em;background:#1d1613;border:1px solid #66513b;border-radius:6px;font-size:.8em;}
  #wdAccessoryPage h3{margin:0;font-size:1em;letter-spacing:.15em;color:#e0b54a;}
  .wd-equipped{display:flex;align-items:flex-start;gap:.6em;font-size:.85em;}
  .wd-equipped img{width:3em;height:3em;flex:none;background:#15100f;border:1px solid #66513b;border-radius:4px;padding:.25em;}
  #wdAccessoryList{display:flex;flex-direction:column;max-width:100%;max-height:32vh;overflow-y:auto;}
  #wdAccessoryPage .wd-acts{flex-direction:column;}
  #wdInventoryLayout.equipment-hidden{width:min(42em,96vw);}
  @media(max-width:900px){#wdBag{font-size:16px;}#wdAccessoryPage{flex-basis:15em;}#wdInventoryLayout{gap:.6em;}}
  #wdBag{overflow-x:auto;}
  #wdInventoryLayout{min-width:600px;}
  #wdChestArea{display:contents;} #wdHand{font-size:.75em;color:#e0b54a;} #wdChestTitle{font-size:.8em;}
  @media(max-height:750px){#wdBag .wd-grid button{width:2.7em;height:2.7em;} #wdBagInfo{min-height:0;}}
  .wd-grid{ display:grid; grid-template-columns:repeat(5, auto); gap:.35em; }
  .overlay .wd-grid button{ min-width:0; width:3.4em; height:3.4em; padding:0; position:relative; display:flex; align-items:center; justify-content:center; }
  .overlay .wd-grid button img{ width:75%; height:75%; pointer-events:none; }
  .overlay .wd-grid button i{ position:absolute; right:.2em; bottom:.05em; font-style:normal; font-size:.65em; }
  .overlay .wd-grid button.sel{ border-color:#e0b54a; }
  #wdBagInfo{ min-height:2.9em; font-size:.85em; color:#c9b994; white-space:pre-line; }
  .wd-tabs{ display:flex; flex-wrap:wrap; gap:.4em; }
  .overlay .wd-tabs button{ min-width:6em; letter-spacing:.12em; font-size:.8em; }
  .overlay .wd-tabs button.on{ border-color:#e0b54a; color:#e0b54a; }
  .wd-tabhint{ font-size:.65em; color:var(--bone-dim); }
  .wd-craft{ display:grid; grid-template-columns:repeat(2, minmax(0, 15em)); gap:.4em; max-width:94vw; max-height:50vh; overflow-y:auto; padding:.2em; }
  .wd-grp{ grid-column:1 / -1; font-size:.7em; letter-spacing:.14em; text-transform:uppercase; color:var(--bone-dim); margin-top:.3em; text-align:left; }
  .overlay .wd-craft button{ display:flex; align-items:center; gap:.5em; text-align:left; padding:.35em .6em; min-width:0; }
  .overlay .wd-craft button img{ width:2.2em; height:2.2em; flex:none; pointer-events:none; }
  .overlay .wd-craft button span{ display:flex; flex-direction:column; line-height:1.2; font-size:.9em; }
  .overlay .wd-craft button small{ font-size:.75em; color:var(--bone-dim); }
  .overlay .wd-craft button small b{ font-weight:normal; color:#ee5a75; }
  .overlay .wd-craft button small em{ font-style:normal; color:#e0b54a; }
  .wd-dur{ position:absolute; left:12%; right:12%; bottom:8%; height:3px; background:rgba(0,0,0,.6); pointer-events:none; }
  .wd-dur u{ display:block; height:100%; background:#8fd06b; }
  .wd-acts{ display:flex; gap:.5em; flex-wrap:wrap; justify-content:center; }
  .overlay .wd-acts button{ min-width:6em; }
  .uf-meta{ position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:safe center; gap:.55em; background:rgba(10,7,6,.95); z-index:4; overflow-y:auto; padding:5vmin 4vmin; font-size:clamp(14px, 2.2vmin, 24px); text-align:center; color:var(--bone); }
  .uf-meta.on{ display:flex; }
  #wdOverlay.uf-menu .uf-hud, #wdOverlay.uf-menu .uf-pause, #wdOverlay.uf-menu #wdHotbar, #wdOverlay.uf-menu .wd-bar, #wdOverlay.uf-menu .wd-hint{ display:none; }
  .uf-meta h2{ margin:0; letter-spacing:.2em; font-size:1.5em; color:var(--crimson-lt); }
  .uf-meta .uf-sub{ color:var(--bone-dim); font-size:.85em; }
  .uf-row{ display:flex; flex-wrap:wrap; gap:.45em; justify-content:center; max-width:min(46em, 94vw); }
  .overlay .uf-meta button{ font-size:.95em; padding:.45em 1.2em; min-width:11em; }
  .overlay .uf-meta button small{ display:block; font-size:.72em; color:var(--bone-dim); margin-top:.15em; font-weight:normal; }
  .uf-help{ white-space:normal; width:100%; max-width:40em; padding-top:.6em; text-align:left; line-height:1.5; font-size:.9em; }
  .uf-help h3{ margin:1.2em 0 .4em; padding-bottom:.25em; border-bottom:1px solid var(--line,#3a2c27); color:var(--crimson-lt); font-size:.95em; letter-spacing:.14em; text-transform:uppercase; }
  .uf-help h3:first-child{ margin-top:0; }
  .uf-help ul{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:.45em; }
  .uf-help li{ position:relative; padding-left:1.1em; }
  .uf-help li::before{ content:'\2022'; position:absolute; left:.1em; color:var(--bone-dim,#8f8470); }
  .uf-help li b{ color:#f0e2bd; font-weight:600; }
  #wdMsg{ max-width:min(34em,90vw); white-space:pre-line; }
  .pad-focus{ outline:2px solid #e0b54a !important; outline-offset:2px; box-shadow:0 0 8px rgba(224,181,74,.6) !important; }
  #wdBag .wd-craft button.pad-focus:disabled{ opacity:.75 !important; }
  .overlay{
    position:fixed; inset:0; background:rgba(10,7,6,.9); z-index:50;
    display:none; flex-direction:column; align-items:center; justify-content:safe center; gap:1rem; color:var(--bone);
    overflow-y:auto; padding:1rem 0;
  }
  .overlay.show{display:flex;}
  .overlay h2{font-size:1.7rem; margin:0;}
  .overlay{ --bg2:#1d1613; --bone:#d9c9a3; --bone-dim:#8f8470; --line:#3a2c27; color:var(--bone); }
  .overlay button{
    background:var(--bg2); border:1px solid var(--line); color:var(--bone);
    border-radius:4px; padding:.5rem 1.1rem; cursor:pointer; font-size:.85rem; font-family:inherit;
  }
  .overlay{ padding-top:calc(1rem + env(safe-area-inset-top,0px)); padding-bottom:calc(1rem + env(safe-area-inset-bottom,0px)); padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px); }
  #wdPanel{overflow-y:auto;justify-content:safe center;}
  #wdPanel [hidden]{display:none !important;}
  #wdPauseMain,#wdPauseSettings{display:flex;flex-direction:column;gap:.45rem;width:min(24rem,100%);}
  #wdPauseHelp{width:min(42rem,100%);max-width:none;margin-top:.4rem;}
  #wdPauseBack{position:sticky;bottom:0;box-shadow:0 0 0 .5rem rgba(10,7,6,.92);}
  #wdPanel button{min-height:2.6rem;}
</style>
</head>
<body>
<div class="overlay show uf-menu" id="wdOverlay">
  <div class="uf-stage"><canvas id="wdCanvas"></canvas>
    <div class="uf-panel" id="wdPanel" role="dialog" aria-modal="true" aria-label="Pause menu">
      <h2 id="wdPauseTitle">PAUSED</h2><div id="wdMsg" role="status" aria-live="polite"></div>
      <div id="wdPauseMain"><button id="wdResume">Resume</button><button id="wdSaveNow">Save world</button><button id="wdSettings">Settings</button><button id="wdControls">Controls &amp; survival guide</button><button id="wdTitleMenu">Save &amp; return to Wilds menu</button><button id="wdLeave">Save &amp; leave Wilds</button></div>
      <div id="wdPauseSettings" hidden><div class="uf-sub">Volume (0–100%) · select to increase; wraps to 0</div>
        <button id="wdVolumeMaster"></button><button id="wdVolumeSfx"></button><button id="wdVolumeEnv"></button><button id="wdVolumeMusic"></button><button id="wdVolumeDanger"></button>
        <button id="wdFullscreen"></button><button id="wdHaptics"></button><button id="wdEffects"></button><button id="wdScenery"></button><button id="wdSwapAB"></button><button id="wdSwapXY"></button>
      </div><div id="wdPauseHelp" class="uf-help" hidden></div><button id="wdPauseBack" hidden>Back to pause menu</button>
    </div>
    <div class="uf-panel" id="wdBag">
      <div class="wd-tabs"><button id="wdTabBag">BAG</button><button id="wdTabCraft">CRAFT</button><button id="wdTabCook">COOK</button><button id="wdTabCheat">CHEATS</button></div>
      <div class="wd-tabhint" id="wdTabHint"></div>
      <div id="wdInventoryLayout">
      <div id="wdInventoryMain">
      <div id="wdBagPage" style="display:contents">
        <div class="wd-grid" id="wdBagGrid"></div>
        <div id="wdChestArea"><div id="wdChestTitle">CHEST · 10 slots</div><div class="wd-grid" id="wdChestGrid"></div></div>
        <div id="wdHand"></div><div id="wdBagInfo"></div>
        <div class="wd-acts"><button id="wdTakeOne">Pick up 1</button><button id="wdPlaceOne">Place 1</button><button id="wdTransfer">Move stack</button><button id="wdTransferOne">Move 1</button><button id="wdQuickStack">Quick stack</button></div>
        <div class="wd-acts"><button id="wdEat">Eat</button><button id="wdCook">Cook</button><button id="wdLight">Light</button><button id="wdFuel">Refuel</button><button id="wdDrop">Drop</button></div>
      </div>
      <div id="wdCraftPage" style="display:contents">
        <div class="wd-craft" id="wdCraftList"></div>
        <div id="wdCraftInfo" style="font-size:.8em; color:#c9b994; min-height:1.4em"></div>
      </div>
      <div id="wdCheatPage" style="display:none">
        <div style="max-width:32em">WILDS SANDBOX · Spawn one item or a full stack. Creative survival prevents damage, hunger and tool wear. Bag overflow drops at your feet.</div>
        <div class="wd-acts"><button id="wdCheatToggle"></button><button id="wdCheatHeal">Restore health &amp; belly</button></div>
        <div class="wd-acts"><button id="wdCheatKit">Builder's supply crate</button><button id="wdCheatTools">Explorer's kit</button><button id="wdCheatDawn">Summon sunrise</button></div>
        <div class="wd-acts"><button id="wdCheatAmount">Spawn amount: full stack</button></div>
        <div class="wd-craft" id="wdCheatList"></div>
      </div>
      </div>
      <div id="wdAccessoryPage" style="display:none" aria-label="Equipment">
        <h3>EQUIPMENT</h3>
        <div class="wd-equipped"><img id="wdAccessoryIcon" alt=""><div id="wdAccessoryInfo" style="white-space:pre-line"></div></div>
        <div class="wd-equipped"><img id="wdHelmetIcon" alt=""><div id="wdHelmetInfo" style="white-space:pre-line"></div></div>
        <div class="wd-equipped"><img id="wdArmorIcon" alt=""><div id="wdArmorInfo" style="white-space:pre-line"></div></div><div class="wd-acts"><button id="wdAccessoryRemove">Unequip accessory</button><button id="wdArmorRemove">Unequip armor</button><button id="wdHelmetRemove">Unequip helmet</button></div>
        <div class="wd-craft" id="wdAccessoryList"></div>
      </div>
      </div>
      <button id="wdBagClose">Close</button>
    </div>
    <div class="uf-meta on" id="wdMeta"></div>
  </div>
  <div class="uf-hud">
    <div class="uf-stats"><div class="uf-hp"><span>HP</span> <b id="wdHp">29</b></div><div class="wd-belly" id="wdBellyBox"><span>BELLY</span> <b id="wdBelly">30</b></div></div>
    <div class="wd-clock"><canvas id="wdDial"></canvas><div class="uf-roomlab" id="wdDay"></div><div class="uf-roomlab" id="wdRegion"></div></div>
  </div>
  <div class="wd-hint" id="wdHint"></div>
  <div id="wdHotbar">
    <div id="wdHotbarItem"></div>
    <div id="wdHotbarActions"><button id="wdHotbarUse">Use</button><button id="wdHotbarCook">Cook</button><button id="wdHotbarDrop">Drop 1</button><button id="wdHotbarBag">Bag</button></div>
    <div class="wd-bar" id="wdBar"></div>
  </div>
  <button id="wdPause" class="uf-pause">Pause</button>
</div>

<script>
(function(){
  let audioCtx = null;
  const SOUND_DEFAULTS = {v:2, master:0.5, sfx:0.5, env:0.5, music:0.5, danger:0.5, haptics:true, dmgNums:true};
  const SOUND_BASE = {master:0.8, sfx:1, env:0.55, music:1, danger:1};
  let sound = Object.assign({}, SOUND_DEFAULTS);
  try{
    const sv = JSON.parse(localStorage.getItem('bloodline_sound')||'null');
    if(sv && sv.v===2) Object.assign(sound, sv);
    else if(sv && typeof sv.haptics==='boolean') sound.haptics = sv.haptics; // older saves used another scale: keep only the vibration choice
  }catch(e){}
  const soundGain = k => SOUND_BASE[k] * sound[k] * 2;
  let busMaster = null, busSfx = null;
  function applySound(){
    if(!audioCtx || !busMaster) return;
    const t = audioCtx.currentTime;
    busMaster.gain.setTargetAtTime(soundGain('master'), t, 0.05);
    busSfx.gain.setTargetAtTime(soundGain('sfx'), t, 0.05);
    if(amb){ amb.envBus.gain.setTargetAtTime(soundGain('env'), t, 0.05); amb.musicBus.gain.setTargetAtTime(soundGain('music'), t, 0.05); amb.dangerBus.gain.setTargetAtTime(soundGain('danger'), t, 0.05); }
    if(tm) tm.vol.gain.setTargetAtTime(soundGain('music'), t, 0.05);
  }
  function initAudio(){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      else if(audioCtx.state==='suspended') audioCtx.resume();
      if(!busMaster){
        // a limiter at the very end, so doubled sliders in a big fight squash peaks instead of crackling
        const lim = audioCtx.createDynamicsCompressor();
        lim.threshold.value = -6; lim.knee.value = 4; lim.ratio.value = 12; lim.attack.value = 0.003; lim.release.value = 0.15;
        lim.connect(audioCtx.destination);
        busMaster = audioCtx.createGain(); busMaster.connect(lim);
        busSfx = audioCtx.createGain(); busSfx.connect(busMaster);
        applySound();
      }
    }catch(e){}
  }
  let amb = null;
  const midiHz = m => 440*Math.pow(2, (m-69)/12);
  function grPluck(f, at, dest){
    const ctx = audioCtx, o = ctx.createOscillator(), lp = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(f, at);
    lp.type = 'lowpass'; lp.frequency.value = 2600;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.09, at+0.006); g.gain.exponentialRampToValueAtTime(0.0001, at+0.26);
    o.connect(lp); lp.connect(g); g.connect(dest || amb.musicBus); o.start(at); o.stop(at+0.3);
  }
  function grBass(f, at, dest){
    const ctx = audioCtx, g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.16, at+0.01); g.gain.exponentialRampToValueAtTime(0.0001, at+0.45);
    for(const [mul, type] of [[1,'sine'],[2,'triangle']]){ const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f*mul, at); o.connect(g); o.start(at); o.stop(at+0.5); }
    g.connect(dest || amb.musicBus);
  }
  function grPad(at, dur, dest, notes){
    const ctx = audioCtx, lp = ctx.createBiquadFilter(), g = ctx.createGain();
    lp.type = 'lowpass'; lp.frequency.value = 650; lp.Q.value = 3;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.035, at+1.6); g.gain.setValueAtTime(0.035, at+dur-1.2); g.gain.exponentialRampToValueAtTime(0.0001, at+dur+0.4);
    for(const [f, det] of (notes || [[110, -6], [164.8, 5], [116.5, 0]])){ const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det; o.connect(lp); o.start(at); o.stop(at+dur+0.5); } // A and E, with a B-flat rubbing against the A
    lp.connect(g); g.connect(dest || amb.musicBus);
  }
  let tm = null;
  function beep(freq, dur, type, vol, delay, dest){

  //  - Don't Starve's campfire (grass and logs, fed with logs, burns out) and its food: raw meat hurts, cooking it on a fire heals.
  //  - Terraria's mediumcore death (and Don't Starve Together's): all you carry drops where you fell. You wake at your last campfire.
  //  - Crafted weapons/tools, single strikes, soft lock and Jackals.

  function wdPickups(dt){ /* walk over what lies on the ground to take it */
    const p = wd.p;
