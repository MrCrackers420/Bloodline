  // a guardian: it walks at you, and between steps it slams the floor around it, throws a ring of bolts, or charges. Twice it calls for help
  function ufBossAct(f, dt, s){

  // Spike strips: rows of floor tiles, one or two wide, across a good part of the room. Each tile goes down, warns, then rises. A strip either
  // rises as a wave running along it, or all at once with the strip beside it rising half a beat later, so there is always a way through
  const UF_SPK = 2600, UF_TILE = 26;

  function ufSpikeStrips(R){

        const nearTaken = [-1,0,1].some(d=>taken.has((horiz ? cx : cx + d) + ',' + (horiz ? cy + d : cy))); // a row of floor is left between strips

  function ufSpikes(){ // anything standing on a tile as it rises is cut; a roll goes over

    const on = o => up.some(q=>Math.abs(o.x-q.x) < 13 + o.r*0.5 && Math.abs(o.y-q.y) < 13 + o.r*0.5);
    for(const p of ufBodies()) if(!p.down && uf.time - (p._spkT||-1e9) > 700 && p.rollT <= 0 && !(p.jumpT > 0) && on(p)){ p._spkT = uf.time; ufHurtHero(p, 2, null, 'the spikes'); }
    for(const f of uf.foes) if(uf.time - (f._spkT||-1e9) > 700 && f.spawnT <= 0 && !f.boss && on(f)){ f._spkT = uf.time; ufHurtF(f, 2, 0, 0); }

  function ufDoorC(k){ const d = UF_DOORS[k]; return k==='t' || k==='b' ? {x:d.x, y:d.y + d.h/2} : {x:d.x + d.w/2, y:d.y + d.h/2}; }
  function ufSecretCheck(r){ // a heavy blow or the relic near a cracked wall breaks it open

    for(const [k, link] of Object.entries(uf.here.links)){ if(link!=='secret') continue; const c = ufDoorC(k); if(Math.hypot(p.x-c.x, p.y-c.y) > r) continue;
      ufLink(k, 'open'); uf.banner = {text:'The wall gives way', t:1600}; uf.shake = 200; thud(0.6, 0.2, 180); beep(70, 0.5, 'sawtooth', 0.04);

  function ufHeroStep(dt, I){ // one hero's own part of a step: timers, attacks, curse, hook, spin, leap, roll, walking, the current
    const p = uf.p, s = dt/1000;
    for(const k of ['rollCd','inv','heavyCd']) if(p[k] > 0) p[k] -= dt;
    if(p.down){ p.cursing = false; p.queued = false; p.spinning = false; p.swingT = 0; p.heavyT = 0; p.rollT = 0; p.jumpT = 0; uf.radial = null; return; }
    if(p.comboT > 0){ p.comboT -= dt; if(p.comboT <= 0) p.combo = 0; }
    if(p.swingT > 0){ p.swingT -= dt; if(p.swingT <= 0 && p.queued) ufSwing(); }
    if(p.heavyT > 0){ p.heavyT -= dt; if(p.heavyT <= 0) ufHeavyLand(); }
    // the curse: hold to aim (left stick, or the mouse), release to cast
    if(I.curse && !p.cursing && !ufBusy() && p.swingT <= 0){ if(uf.blood >= ufCurseCost()){ p.cursing = true; p.cx = p.fx; p.cy = p.fy; } else if(!p.curseNoted){ p.curseNoted = true; beep(140, 0.1, 'square', 0.02); } }
    if(!I.curse) p.curseNoted = false;
    if(p.cursing){ const l = Math.hypot(I.mx, I.my); if(I.mouseAim){ p.cx = I.mouseAim.x; p.cy = I.mouseAim.y; } else if(l > 0.3){ p.cx = I.mx/l; p.cy = I.my/l; } if(!I.curse) ufCurseCast(); }
    const ml = Math.hypot(I.mx, I.my);
    if(ml > 0.2 && !p.cursing && p.swingT <= 0 && p.heavyT <= 0 && p.rollT <= 0){ p.fx = I.mx/ml; p.fy = I.my/ml; }
    if(p.castCd > 0) p.castCd -= dt; ufHookStep(dt);
    p.spinning = uf.who==='thresher' && I.rollHeld && !p.cursing && p.heavyT <= 0;
    if(p.spinning){ p.swingT = 0; p.queued = false; p.spinA = (p.spinA||0) + dt*0.018; p.spinT = (p.spinT||0) - dt;
      if(p.spinT <= 0){ p.spinT = UF_SPIN.iv; let hits = 0; thud(0.04, 0.05, 1700);
        for(const f of uf.foes){ const dx = f.x-p.x, dy = f.y-p.y, d = Math.hypot(dx,dy) || 1; if(f.spawnT <= 0 && d <= UF_SPIN.r + f.r){ ufHurtF(f, UF_SPIN.dmg, dx/d*50, dy/d*50); hits++; } }
        for(const q of uf.props) if(!q.broken && Math.hypot(q.x-p.x, q.y-p.y) <= UF_SPIN.r + q.r) ufBreak(q);
        ufCutWebsNear(p.x, p.y, UF_SPIN.r); if(hits) uf.blood = Math.min(uf.cap, uf.blood + hits*UF.hitBlood); } }
    if(p.jumpT > 0){ p.jumpT -= dt; const sp = UF_LEAP.dist/UF_LEAP.ms*1000; p.x += p.dx*sp*s; p.y += p.dy*sp*s;
      const lo = UF_WALL + p.r; p.x = Math.max(lo, Math.min(UF_W-lo, p.x)); p.y = Math.max(lo, Math.min(UF_H-lo, p.y)); if(p.jumpT <= 0) ufLand(); }
    else if(p.rollT > 0){ p.rollT -= dt; p.x += p.dx*UF.rollSpd*s; p.y += p.dy*UF.rollSpd*s; ufFx({kind:'trail', x:p.x, y:p.y, t:180, col:p.rgb}); }
    else { const m = (p.heavyT > 0 ? 0.15 : p.swingT > 0 ? UF.swingMove : p.cursing ? UF.curseMove : p.spinning ? UF_SPIN.move : 1) * ufSlow(p); const sp0 = UF.spd*(ufHas('path') ? 1.25 : 1); p.x += I.mx*sp0*m*s; p.y += I.my*sp0*m*s; }
    { const wet = ufWet(p); if(wet && p.rollT <= 0) p.x += UF_CURRENT*ufFlow(p)*s; /* the current carries you */
      if(wet!==!!p._wet){ p._wet = wet; thud(0.12, wet ? 0.1 : 0.05, wet ? 1300 : 2200); for(let k=0;k<6;k++){ const a = -Math.PI*Math.random(), v = 40 + Math.random()*60; ufFx({kind:'chip', x:p.x, y:p.y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, col:'#8fd0dc', t:380}); } } }
    if(!(p.jumpT > 0)) ufSolid(p); /* in the air over pillars and props */
  }
  function ufTriggers(){ // an altar, the merchant or the shrine, a map, a prisoner, a larva, the stairs: whoever of the party stands nearest meets them. True when a menu opened or the floor changed
    const R = uf.here, al = uf.altar, np = R.npc, mi = R.mapItem, pr = R.prisoner, sc = R.sac, st = R.stairs;
    const dist = o => { const n = ufNearHero(o); return n.down ? 1e9 : Math.hypot(n.x-o.x, n.y-o.y); };
    const meet = (o, r) => { const n = ufNearHero(o); return !n.down && Math.hypot(n.x-o.x, n.y-o.y) < n.r + r ? n : null; };
    if(al && !al.taken){ const d = dist(al); if(d > 40) al.armed = true; else if(al.armed){ const n = meet(al, 14); if(n){ al.armed = false; ufAs(ufIdx(n), () => ufOffer('tarot', al.opts)); return true; } } }
    if(np && !np.spent){ const d = dist(np); if(d > 46) np.armed = true; else if(np.armed){ const n = meet(np, 18); if(n){ np.armed = false; ufAs(ufIdx(n), () => np.kind==='shop' ? ufShop() : ufShrine()); return true; } } }

    const pn = ufEl('ufPanel'); if(msg==null){ pn.classList.remove('on'); ufEl('ufSeats').innerHTML = ''; return; }

    if(!!activePad()) padSet(ufEl('ufResume')); // a controller starts on the first choice
  }
  function ufPauseText(){
    const lines = [`Paused\n\nFloor ${uf.floor} of ${UF_FLOORS} · seed ${uf.seed}`], n = uf.crew.length;
    for(const id of uf.tarot){ const T = UF_TAROT.find(t=>t.id===id); lines.push(`${T.glyph} ${T.name}: ${T.text}`); }
    for(const id of uf.curses){ const C = UF_CURSES.find(t=>t.id===id); lines.push(`${C.glyph} ${C.name}: ${C.text}`); }
    lines.push(n >= UF_SEATS ? `A party of ${n}.` : n > 1 ? `A party of ${n}. Start on another controller brings in one more.` : 'Start on a second controller brings in another player.');
    ufPanel(lines.join('\n'));
    const box = ufEl('ufSeats'); box.innerHTML = '';
    if(n > 1){
      for(let i = 1; i < n; i++){ const b = document.createElement('button'), c = uf.crew[i]; b.textContent = `Send Player ${c.id+1} home`; b.onclick = () => ufDropSeat(uf.crew.indexOf(c)); box.appendChild(b); }
      if(uf.crew[0].pad !== null){ const b = document.createElement('button'); b.textContent = 'Player 1 plays on the keyboard'; b.onclick = () => { uf.crew[0].pad = null; uf.noPin = true; ufPauseText(); }; box.appendChild(b); } // frees their controller for someone else's Start
    }
  }
  function ufTogglePause(padIdx){ // padIdx: the controller that pressed Start, so only it drives the menu while the others wait
    if(!uf || uf.over){ if(ufEl('ufMeta').classList.contains('on')) ufClose(); return; } // Back on the menu screens leaves
    if(uf.choosing) return; uf.paused = !uf.paused; uf.toggledAt = performance.now();
    menuPadIdx = uf.paused && uf.crew.length > 1 && typeof padIdx === 'number' ? padIdx : null;
    if(menuPadIdx !== null){ padHeld[9] = true; padHeld[8] = true; padHeld[0] = true; padHeld[1] = true; } // the button that paused is still down: it must not also act in the menu
    if(uf.paused) ufPauseText(); else ufPanel(null);
    ufEl('ufPause').textContent = uf.paused ? 'Resume' : 'Pause';
  }
  function ufLoop(ts){
    if(!ufActive){ ufRaf = 0; return; }
    const dt = Math.min(50, ts - ufLast); ufLast = ts;
    if(uf) try{
      const pads = ufPadsNow();
      if(!uf.over) ufCoopPoll(pads);
      const G = uf.crew.map(c => { const g = c.pad !== null ? pads[c.pad] : null; return g ? ufPadRead(g, ufIn.pads[c.pad] || (ufIn.pads[c.pad] = {})) : null; });
      if(!uf.paused && !uf.over && performance.now() - (uf.toggledAt||0) > 300){ const i = G.findIndex(g => g && g.start); if(i >= 0) ufTogglePause(uf.crew[i].pad); } // once paused, the menu code drives the panel's buttons
      if(!uf.paused && !uf.over){
        const Is = uf.crew.map((c, i) => ufAs(i, () => { const I = ufRead(G[i], i===0); uf.lastI = I; return I; }));
        uf.crew.forEach((c, i) => { const g = G[i]; if(!g || ufBody(i).down || uf.over || uf.paused) return; ufAs(i, () => { if(g.roll) ufRoll(); if(g.attack) ufAttack(); if(g.heavy) ufHeavy(); if(g.relic) ufRelic(); }); });
        if(uf && !uf.over && !uf.paused){
          uf.crew.forEach((c, i) => { if(!ufBody(i).down) ufAs(i, () => ufRadial(G[i], dt, i===0)); });
          const gdt = uf.crew.length === 1 && uf.radial ? dt*0.3 : dt; // the wheel slows the room (a party plays on: nobody waits while one player picks a card)
          ufStep(gdt, Is);
          for(const e of uf.fx) e.t -= gdt; uf.fx = uf.fx.filter(e=>e.t > 0);
          if(uf.shake > 0) uf.shake -= gdt;
        }
      }
      if(uf){ ufDraw(uf.paused || uf.over ? 0 : dt); ufHud(); fxWatch(dt); }
    }catch(e){ noteError(e); }
    ufRaf = requestAnimationFrame(ufLoop);
  }
  // the Catacombs's own score: slow D minor at about 100, with a dark C-sharp. In a cleared room only the drone, a slow pad and a
  // sparse pluck; while anything is alive a bass in 3+3+2, a kick and a snap come in under the full line. Nothing under 70 Hz
  const UF_EIGHTH = 0.24; /* the length of an eighth; the score steps in sixteenths, half this */
  const UF_LINE = [[62,0,0,65,0,64,0,60],[62,0,0,57,0,0,61,0],[58,0,62,0,65,0,64,62],[61,0,0,64,0,0,57,0]];
  const UF_ROOT = [38, 38, 34, 33]; // D, D, B-flat, A
  const UF_CHORD = [[[146.8,-4],[174.6,3],[220,0]], [[146.8,-4],[174.6,3],[220,0]], [[116.5,-4],[146.8,3],[174.6,0]], [[110,-4],[138.6,3],[164.8,0]]];
  let ufMus = null;
  function ufHat(at, B, v){ const ctx = audioCtx, n = ctx.createBufferSource(), hp = ctx.createBiquadFilter(), g = ctx.createGain(); // a closed hi-hat
    n.buffer = hfNoiseBuf(); hp.type = 'highpass'; hp.frequency.value = 7000; g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(v, at + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.05);
    n.connect(hp); hp.connect(g); g.connect(B); n.start(at, Math.random()); n.stop(at + 0.07); }
  function ufArp(f, at, B, v){ const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = 'square'; o.frequency.value = f; // a thin, quick arpeggio note
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(v, at + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.11); o.connect(g); g.connect(B); o.start(at); o.stop(at + 0.13); }
  function ufMusicStep(step, at, fight){ /* sixteenths at about 125 bpm: the room fight drives hard, an empty room keeps a quieter pulse */
    const B = ufMus.bus, bar = Math.floor(step/16), i = step%16, ph = bar%4, d = at - audioCtx.currentTime, e = i%2===0 ? i/2 : -1, ch = UF_CHORD[ph];
    if(i===0 && bar%2===0) grPad(at, 2*16*UF_EIGHTH/2, B, ch);
    const arp = ch.map(c=>c[0]*4); // the chord two octaves up
    if(fight){
      if(i===0 || i===6 || i===12 || i===14) grBass(midiHz(UF_ROOT[ph] + (i===14 ? 7 : 0)), at, B);   // 3+3+2, with a lift into the next bar
      if(i===0 || i===6 || i===8 || (i===14 && bar%2)) thud(0.16, 0.1, 240, d, B);                     // kick
      if(i===4 || i===12) thud(0.07, 0.06, 1600, d, B);                                               // snap on the backbeat
      ufHat(at, B, i%4===2 ? 0.05 : 0.022);                                                            // hats on every sixteenth, accented off the beat
      ufArp(arp[(i + bar)%3], at, B, 0.008);                                                           // a running arpeggio
      const n = e>=0 && UF_LINE[ph][e]; if(n) grPluck(midiHz(n + (bar%8 >= 4 ? 12 : 0)), at, B);
    } else {
      if(i===0 || i===10) grBass(midiHz(UF_ROOT[ph]), at, B);
      if(i===0 || i===8) thud(0.12, 0.04, 220, d, B);                                                  // a soft heartbeat of a kick
      if(i%4===2) ufHat(at, B, 0.012);
      if(i%2===0) ufArp(arp[(i/2)%3], at, B, 0.004);
      const n = e>=0 && UF_LINE[ph][e]; if(n && bar%2===1) grPluck(midiHz(n + 12), at, B);
      if(Math.random() < 0.02) beep(1760 + Math.random()*900, 0.25, 'sine', 0.012, d, B); // water dripping somewhere
    }
  }
  function ufMusicTick(){
    if(!ufMus || !audioCtx) return;
    try{ const t = audioCtx.currentTime, lvl = soundGain('music') * (uf && uf.paused ? 0.35 : 1);
      if(ufMus.lvl!==lvl){ ufMus.lvl = lvl; ufMus.bus.gain.setTargetAtTime(lvl, t, 0.3); }
      if(ufMus.next < t) ufMus.next = t + 0.05;
      const fight = !!uf && !uf.cleared && !uf.over;
      while(ufMus.next < t + 0.35){ ufMusicStep(ufMus.step, ufMus.next, fight); ufMus.next += UF_EIGHTH/2; ufMus.step++; }
    }catch(e){ noteError(e); }
  }
  function ufMusicStart(){
    if(!audioCtx) return;
    try{ if(!ufMus){ const g = audioCtx.createGain(); g.gain.value = 0; g.connect(busMaster || audioCtx.destination); ufMus = {bus:g, step:0, next:0, timer:0, lvl:-1}; }
      ufMus.lvl = -1; ufMus.step = 0; ufMus.next = audioCtx.currentTime + 0.3; clearInterval(ufMus.timer); ufMus.timer = setInterval(ufMusicTick, 100);
    }catch(e){ noteError(e); }
  }
  function ufMusicStop(){ if(!ufMus) return; clearInterval(ufMus.timer); ufMus.timer = 0; try{ ufMus.bus.gain.setTargetAtTime(0, audioCtx.currentTime, 0.4); }catch(e){} }
  function ufOpen(){
    initAudio();
    ufActive = true; uf = null; ufHudLast = ''; ufPanel(null); ufEl('ufPick').classList.remove('on');
    ufEl('ufOverlay').classList.add('show'); ufMenu('setup'); ufMusicStart();
    cancelAnimationFrame(ufRaf); ufLast = performance.now(); ufRaf = requestAnimationFrame(ufLoop);
  }
  function ufClose(){
    ufActive = false; cancelAnimationFrame(ufRaf); ufRaf = 0; uf = null;
    ufIn.keys = {}; ufIn.mouseCurse = false;
    ufEl('ufMeta').classList.remove('on'); ufEl('ufOverlay').classList.remove('uf-menu');
    ufEl('ufOverlay').classList.remove('show'); ufEl('ufPick').classList.remove('on'); ufMusicStop(); showTitle();
  }
  ufEl('ufPause').onclick = ufTogglePause;
  ufEl('ufResume').onclick = ()=>{ if(!uf) return; uf.paused = false; menuPadIdx = null; uf.toggledAt = performance.now(); ufPanel(null); ufEl('ufPause').textContent = 'Pause'; };
  ufEl('ufRestart').onclick = ()=>{ if(uf && !uf.over){ uf.gaveUp = true; ufPanel(null); ufEndRun(false); } };
  ufEl('ufLeave').onclick = ufClose;
  ufEl('ufPickSkip').onclick = ()=>{ if(uf && uf.choosing) ufClosePick(); };
  BACK_BUTTONS.ufOverlay = 'ufPause'; // Escape, or the phone's Back, pauses
  window.addEventListener('keydown', e=>{
    if(!ufActive) return; const k = e.code;
    if(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyJ','KeyK','KeyL','KeyQ','KeyE'].includes(k)) e.preventDefault();
    if(e.repeat) return; ufIn.keys[k] = true;
    ufKb(k==='Space' ? ufRoll : k==='KeyJ' ? ufAttack : k==='KeyK' ? ufHeavy : k==='KeyQ' ? ufRelic : null);
  });
  window.addEventListener('keyup', e=>{ ufIn.keys[e.code] = false; });
  { const cv = ufEl('ufCanvas');
    const world = e=>{ const r = cv.getBoundingClientRect(), v = uf && uf.view; return v ? {x:(e.clientX - r.left - v.ox)/v.sc, y:(e.clientY - r.top - v.oy)/v.sc} : null; };
    cv.addEventListener('pointermove', e=>{ if(e.pointerType==='mouse') ufIn.mouse = world(e); });
    cv.addEventListener('pointerdown', e=>{ if(e.pointerType!=='mouse') return; ufIn.mouse = world(e); if(e.button===2) ufIn.mouseCurse = true; else if(e.button===0) ufKb(ufAttack); });
    cv.addEventListener('pointerleave', e=>{ if(e.pointerType==='mouse') ufIn.mouse = null; });
    cv.addEventListener('contextmenu', e=>e.preventDefault());
    window.addEventListener('pointerup', e=>{ if(e.pointerType==='mouse' && e.button===2) ufIn.mouseCurse = false; }); }
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden && uf && !uf.paused && !uf.over) ufTogglePause(); });


  // ---- controller and Back on this page ----
  const PAD_SEL = 'button, .deck-card:not(.locked), .card, .crate-tile, .base-cell.bld, .frag:not(.locked), input, select, textarea';
  function padTop(){ const open = [...document.querySelectorAll('.overlay.show')]; if(!open.length) return null; const z = e => parseInt(getComputedStyle(e).zIndex,10) || 0, all = [...document.querySelectorAll('.overlay')];
    return open.sort((a,b)=> (z(a)-z(b)) || (all.indexOf(a)-all.indexOf(b))).pop(); }
  function padCands(){ const top = padTop(), root = top || document;
    return [...root.querySelectorAll(PAD_SEL)].filter(e=>{ if(e.disabled || (!top && e.closest('.overlay'))) return false; const r = e.getBoundingClientRect(); if(r.width<2 || r.height<2) return false;
      const cs = getComputedStyle(e); return cs.visibility!=='hidden' && cs.pointerEvents!=='none' && e.offsetParent!==null; }); }
  function padMove(dx, dy){
    const c = padCands(); if(!c.length){ padSet(null); return; }
    if(!padEl || !c.includes(padEl)){ padSet(c.find(e=>e.classList.contains('title-main')) || c[0]); return; }
    // Rows and columns, like a keyboard: up and down go to the nearest row in that direction, then the button most nearly in line
    // (a tie goes to the leftmost); left and right only move along the same row, and do nothing if nothing shares it
    const r = padEl.getBoundingClientRect(), vert = dy!==0, dir = vert ? dy : dx, rc = vert ? r.top + r.height/2 : r.left + r.width/2;
    const box = e => e.getBoundingClientRect();
    const gap = q => Math.max(0, vert ? (dy>0 ? q.top - r.bottom : r.top - q.bottom) : (dx>0 ? q.left - r.right : r.left - q.right));
    let pool = c.filter(e=>{ if(e===padEl) return false; const q = box(e), m = vert ? q.top + q.height/2 : q.left + q.width/2; return (m - rc)*dir > 2; });
    if(!vert) pool = pool.filter(e=>{ const q = box(e); return q.bottom > r.top + 2 && q.top < r.bottom - 2; });
    if(!pool.length) return;
    const g0 = Math.min(...pool.map(e=>gap(box(e)))), row = pool.filter(e=>gap(box(e)) <= g0 + 10);
    const off = e => { const q = box(e); return Math.abs(vert ? (q.left + q.width/2) - (r.left + r.width/2) : (q.top + q.height/2) - (r.top + r.height/2)); };
    row.sort((a,b)=>{ const d = off(a) - off(b); return Math.abs(d) > 12 ? d : (box(a).left - box(b).left) || (box(a).top - box(b).top); });
    padSet(row[0]); beep(660, 0.03, 'triangle', 0.02);
  }
  function padPress(){
    if(!padEl || !padCands().includes(padEl)){ padMove(0, 1); return; }
    if(padEl.tagName==='INPUT' || padEl.tagName==='TEXTAREA'){ padEl.focus(); return; }
    padEl.click();
  }
  function goBack(){ const btn = document.getElementById(BACK_BUTTONS.ufOverlay || 'ufPause'); if(btn && btn.offsetParent!==null){ btn.click(); return true; } const lv = document.getElementById('ufLeave'); if(lv && lv.offsetParent!==null){ lv.click(); return true; } return true; }
  const padAnyPressed = () => { const g = activePad(); return !!g && g.buttons.some(b=>b && b.pressed); };
  const ufPadPlaying = () => ufActive && uf && !uf.paused && !uf.over && padAnyPressed(); /* a controller button that Edge also turned into Back */
  window.addEventListener('keydown', e=>{ if(e.key==='Escape'){ e.preventDefault(); if(!ufPadPlaying()) goBack(); } });
  for(const ev of ['keydown','pointerdown']) window.addEventListener(ev, padWakeAudio, true);
  function padPoll(){
    if(ufActive && uf && !uf.paused && !uf.over){ /* the arena reads the pad itself while you play; menus take over when its panel is up */
      const g0 = activePad(); if(g0){ for(const k of [0,1,8,9]) padHeld[k] = !!(padBtn(g0,k) && padBtn(g0,k).pressed); padHeld.dir = true; }
      requestAnimationFrame(padPoll); return; }
    const g = activePad();
    if(g){ if(g.buttons.some(x=>x && x.pressed)) padWakeAudio(); const b = k => !!(padBtn(g,k) && padBtn(g,k).pressed), ax = g.axes[0]||0, ay = g.axes[1]||0;
      const dir = (b(12) || ay < -0.5) ? [0,-1] : (b(13) || ay > 0.5) ? [0,1] : (b(14) || ax < -0.5) ? [-1,0] : (b(15) || ax > 0.5) ? [1,0] : null, now = performance.now();
      if(dir){ if(!padHeld.dir || now >= padNext){ padNext = now + (padHeld.dir ? 130 : 380); padAny = true; padMove(dir[0], dir[1]); } padHeld.dir = true; } else padHeld.dir = false;
      const edge = (k, fn)=>{ if(b(k) && !padHeld[k]){ padAny = true; fn(); } padHeld[k] = b(k); };
      edge(0, padPress); edge(1, ()=>goBack()); edge(9, ()=>goBack()); edge(8, ()=>goBack());
    }
    if(padEl && !document.contains(padEl)) padSet(null);
    requestAnimationFrame(padPoll);
  }
  window.addEventListener('pointerdown', ()=>{ if(padEl) padSet(null); }, true);
  window.addEventListener('gamepadconnected', ()=>{ if(!padAny) padMove(0, 1); });
  requestAnimationFrame(padPoll);
  try{ history.pushState({bloodline:1}, ''); window.addEventListener('popstate', ()=>{ if(ufPadPlaying() || goBack()) history.pushState({bloodline:1}, ''); }); }catch(e){} // one step of history keeps the phone's Back inside the game
  // the game in another tab saved the Brood Pit or the bone pit: take it, unless a run here is using it
  window.addEventListener('storage', e=>{ if(uf) return; try{
    if(e.key==='bloodline_pit') pitState = pitClean(JSON.parse(e.newValue||'null'));
    if(e.key==='bloodline_uf') ufMeta = ufCleanMeta(JSON.parse(e.newValue||'null'));
    if(e.key==='bloodline_pit' || e.key==='bloodline_uf') ufMenu('setup');
  }catch(x){} });
  ufOpen();
})();
</script>
